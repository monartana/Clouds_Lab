apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-deployment
  labels:
    app: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
      - name: wp-container
        image: my-wp-image
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        - containerPort: 3306
        env:
        - name: DB_TYPE
          value: "internal"
---
apiVersion: v1
kind: Service
metadata:
  name: wp-service
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
